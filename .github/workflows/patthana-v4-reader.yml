name: Patthana Reader V4 Native Android APK
on:
  push:
    branches: [reader-v4-native-oct23-2026]
    paths: ['V4Reader/**', '.github/workflows/patthana-v4-reader.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: V4Reader
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK from GitHub runner
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build reader APK
        run: gradle --no-daemon --console=plain :app:assembleDebug
      - name: Test generated APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify app/build/outputs/apk/debug/app-debug.apk
      - name: Bundle APK and signing tool
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/Patthana_Reader_V4_unbundled.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" output/apksigner.jar
      - uses: actions/upload-artifact@v4
        with:
          name: Patthana_Reader_V4_Compiled_APK
          path: V4Reader/output/
          retention-days: 14
          if-no-files-found: error