name: Build Patthana Alin V2.3 Android APK

on:
  workflow_dispatch:
    inputs:
      emulator_test:
        description: "Run emulator install/startup check after APK build"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Protect media — require genuinely PRIVATE repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" = "true" || {
            echo "::error::This repository is PUBLIC. Change Settings -> General -> Danger Zone -> Private before uploading app media/building."; exit 1;
          }
      - name: Require full native Android source (not an empty repository)
        shell: bash
        run: |
          test -f settings.gradle.kts || { echo "::error::Missing settings.gradle.kts; upload complete V2.3 source."; exit 1; }
          test -f app/build.gradle.kts || { echo "::error::Missing app/build.gradle.kts; upload complete V2.3 source."; exit 1; }
          test -d app/src/main || { echo "::error::Missing app/src/main."; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Validate bundled assets and metadata
        shell: bash
        run: |
          if test -f scripts/verify_bundle.py; then python3 scripts/verify_bundle.py; fi
      - name: Compile V2.3 APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon --console=plain :app:assembleDebug 2>&1 | tee gradle-build.log
      - name: Validate APK signature, hash and identity
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          if test -f scripts/check_built_apk.py; then python3 scripts/check_built_apk.py app/build/outputs/apk/debug/app-debug.apk; fi
          mkdir -p apk-output
          cp app/build/outputs/apk/debug/app-debug.apk apk-output/Patthana_Alin_Native_V2_3.apk
          sha256sum apk-output/Patthana_Alin_Native_V2_3.apk > apk-output/SHA256SUMS.txt
      - name: Upload signed debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patthana-Alin-V2_3-Native-Debug-APK
          path: apk-output/
          retention-days: 30
          if-no-files-found: error
      - name: Enable KVM for emulator smoke test
        if: ${{ inputs.emulator_test }}
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
      - name: Android emulator startup and crash smoke test
        if: ${{ inputs.emulator_test }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            if test -f scripts/android_emulator_smoke.sh; then bash scripts/android_emulator_smoke.sh; else adb install -r apk-output/Patthana_Alin_Native_V2_3.apk && adb shell monkey -p asia.aaii.patthana 1; fi
      - name: Upload diagnostic log on any result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patthana-Alin-V2_3-Build-Logs
          path: |
            gradle-build.log
            emulator-qa/
          if-no-files-found: warn
          retention-days: 14
