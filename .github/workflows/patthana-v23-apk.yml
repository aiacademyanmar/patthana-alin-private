name: Patthana Alin V2.3 - Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prevent publishing bundled media through a public repository
        env:
          REPO_VISIBILITY: ${{ github.event.repository.private }}
        run: |
          if [ "$REPO_VISIBILITY" != "true" ]; then
            echo "::error::This repo is PUBLIC. Change visibility to PRIVATE before uploading the MP3 assets and running an APK build."
            exit 1
          fi

      - name: Check out Android source
        uses: actions/checkout@v4

      - name: Confirm full V2.3 source is uploaded
        run: |
          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f scripts/verify_bundle.py
          test -f scripts/check_built_apk.py

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Android SDK 35 and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Verify 24 illustrations, 25 MP3 files and catalog
        run: python3 scripts/verify_bundle.py

      - name: Build native Kotlin Jetpack Compose APK
        run: gradle --no-daemon --console=plain --stacktrace :app:assembleDebug

      - name: Inspect APK and verify signing
        run: |
          python3 scripts/check_built_apk.py app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Rename APK and save checksum
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Patthana_Alin_Native_V2_3.apk
          sha256sum Patthana_Alin_Native_V2_3.apk > APK_SHA256.txt

      - name: Upload built APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patthana_Alin_Native_V2_3_APK
          path: |
            Patthana_Alin_Native_V2_3.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30

  startup-smoke-test:
    needs: build-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Download verified debug APK
        uses: actions/download-artifact@v4
        with:
          name: Patthana_Alin_Native_V2_3_APK

      - name: Prepare APK for emulator script
        run: |
          mkdir -p app/build/outputs/apk/debug
          cp Patthana_Alin_Native_V2_3.apk app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android 35 emulator - install and launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android_emulator_smoke.sh

      - name: Upload startup logs and screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Patthana_V2_3_Startup_Test
          path: emulator-qa/
          if-no-files-found: warn
          retention-days: 14
