name: Patthana Alin - Public Preview APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35 (GitHub-hosted runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Assemble Android debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK signing and manifest
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Rename public preview and hash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Patthana_Alin_V2_3_Public_Preview.apk
          sha256sum Patthana_Alin_V2_3_Public_Preview.apk > SHA256SUMS.txt
      - name: Publish APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Patthana_Alin_V2_3_Public_Preview_APK
          path: |
            Patthana_Alin_V2_3_Public_Preview.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
