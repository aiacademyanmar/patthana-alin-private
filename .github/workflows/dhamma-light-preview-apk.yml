name: Dhamma Light Native eLibrary Camera V3.6 APK
on:
  workflow_dispatch:
  push:
    branches:
      - dhamma-light-reader-touch-controls-v3-7-20261024
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled GitHub runner tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile genuine Android APK
        run: gradle --no-daemon --stacktrace -p DhammaLightPreview :app:assembleDebug
      - name: Validate APK exists and compute checksum
        run: |
          test -s DhammaLightPreview/app/build/outputs/apk/debug/app-debug.apk
          cp DhammaLightPreview/app/build/outputs/apk/debug/app-debug.apk DhammaLight_Reader_Touch_V3_7_PROTOTYPE.apk
          sha256sum DhammaLight_Reader_Touch_V3_7_PROTOTYPE.apk > DhammaLight_Reader_Touch_V3_7_PROTOTYPE.apk.sha256
      - name: Package Gradle Android Source
        run: |
          zip -r -q DhammaLight_Reader_Touch_V3_7_GRADLE_SOURCE.zip DhammaLightPreview .github/workflows/dhamma-light-preview-apk.yml
          test -s DhammaLight_Reader_Touch_V3_7_GRADLE_SOURCE.zip
      - name: Export official Android signing tools for local content packaging
        run: |
          mkdir -p verified-android-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" verified-android-tools/apksigner.jar
          cp "$ANDROID_HOME/build-tools/35.0.0/zipalign" verified-android-tools/zipalign
          file verified-android-tools/*
          du -h verified-android-tools/*
      - uses: actions/upload-artifact@v4
        with:
          name: official-android-signing-tools-v35
          path: verified-android-tools/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Dhamma-Light-Reader-Touch-V3_7-APK
          path: |
            DhammaLight_Reader_Touch_V3_7_PROTOTYPE.apk
            DhammaLight_Reader_Touch_V3_7_PROTOTYPE.apk.sha256
            DhammaLight_Reader_Touch_V3_7_GRADLE_SOURCE.zip
          if-no-files-found: error
