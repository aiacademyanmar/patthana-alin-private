name: Dhamma Light Daily Channel V3.3.1 Native APK
on:
  workflow_dispatch:
  push:
    branches:
      - dhamma-light-daily-channel-v3-3-1-20261023
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled GitHub runner tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile genuine Android APK
        run: gradle --no-daemon --stacktrace -p DhammaLightPreview :app:assembleDebug
      - name: Validate APK exists and compute checksum
        run: |
          test -s DhammaLightPreview/app/build/outputs/apk/debug/app-debug.apk
          cp DhammaLightPreview/app/build/outputs/apk/debug/app-debug.apk DhammaLight_Daily_Channel_V3_3_1_PROTOTYPE.apk
          sha256sum DhammaLight_Daily_Channel_V3_3_1_PROTOTYPE.apk > DhammaLight_Daily_Channel_V3_3_1_PROTOTYPE.apk.sha256
      - name: Package Gradle Android Source
        run: |
          zip -r -q DhammaLight_Daily_Channel_V3_3_1_GRADLE_SOURCE.zip DhammaLightPreview .github/workflows/dhamma-light-preview-apk.yml
          test -s DhammaLight_Daily_Channel_V3_3_1_GRADLE_SOURCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Dhamma-Light-Daily-Channel-V3_3_1-APK
          path: |
            DhammaLight_Daily_Channel_V3_3_1_PROTOTYPE.apk
            DhammaLight_Daily_Channel_V3_3_1_PROTOTYPE.apk.sha256
            DhammaLight_Daily_Channel_V3_3_1_GRADLE_SOURCE.zip
          if-no-files-found: error
