name: Dhamma Light Native Preview APK
on:
  workflow_dispatch:
  push:
    branches:
      - dhamma-light-preview-20261023
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled GitHub runner tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile genuine Android APK
        run: gradle --no-daemon --stacktrace -p DhammaLightPreview :app:assembleDebug
      - name: Validate APK exists and compute checksum
        run: |
          test -s DhammaLightPreview/app/build/outputs/apk/debug/app-debug.apk
          cp DhammaLightPreview/app/build/outputs/apk/debug/app-debug.apk DhammaLight_Kids_PREVIEW.apk
          sha256sum DhammaLight_Kids_PREVIEW.apk > DhammaLight_Kids_PREVIEW.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Dhamma-Light-Kids-Preview-APK
          path: |
            DhammaLight_Kids_PREVIEW.apk
            DhammaLight_Kids_PREVIEW.apk.sha256
          if-no-files-found: error
