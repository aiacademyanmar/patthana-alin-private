name: Myat Patthana V5.1 Drive QR Camera Android APK
on:
  workflow_dispatch:
  push:
    branches:
      - myat-patthana-native-v5-1-drive-offline-marker
jobs:
  compile:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK using preinstalled GitHub runner tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile genuine Android APK
        run: gradle --no-daemon --stacktrace -p DhammaLightPreview :app:assembleDebug
      - name: Validate APK exists and compute checksum
        run: |
          test -s DhammaLightPreview/app/build/outputs/apk/debug/app-debug.apk
          cp DhammaLightPreview/app/build/outputs/apk/debug/app-debug.apk MyatPatthana_Native_V5_1_PROTOTYPE.apk
          sha256sum MyatPatthana_Native_V5_1_PROTOTYPE.apk > MyatPatthana_Native_V5_1_PROTOTYPE.apk.sha256
      - name: Package Gradle Android Source
        run: |
          zip -r -q MyatPatthana_Native_V5_1_GRADLE_SOURCE.zip DhammaLightPreview .github/workflows/dhamma-light-preview-apk.yml
          test -s MyatPatthana_Native_V5_1_GRADLE_SOURCE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MyatPatthana-Native-V5_1-APK
          path: |
            MyatPatthana_Native_V5_1_PROTOTYPE.apk
            MyatPatthana_Native_V5_1_PROTOTYPE.apk.sha256
            MyatPatthana_Native_V5_1_GRADLE_SOURCE.zip
          if-no-files-found: error
