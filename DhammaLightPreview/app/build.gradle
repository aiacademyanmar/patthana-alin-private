plugins { id 'com.android.application' }
android {
  namespace 'com.aaii.dhammalight.preview'
  compileSdk 35
  defaultConfig {
    applicationId 'com.aaii.dhammalight.preview'
    minSdk 24
    targetSdk 34
    versionCode 3
    versionName '3.1.0-comic-prototype'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
