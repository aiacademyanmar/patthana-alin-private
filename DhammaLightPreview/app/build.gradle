plugins { id 'com.android.application' }
android {
  namespace 'com.aaii.dhammalight.preview'
  compileSdk 35
  defaultConfig {
    applicationId 'com.aaii.dhammalight.preview'
    minSdk 24
    targetSdk 34
    versionCode 5
    versionName '4.1.0-daily-reading'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
